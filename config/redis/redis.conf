# Afriwind Net - Redis Configuration
# Cache and session store for the ISP platform

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Timeouts
timeout 300
tcp-keepalive 60
